# uv sync installs ha_rig editable, so `python -m ha_rig.terms` runs from any directory (deviceside included).
[project]
name = "ha-rig"
version = "0"
requires-python = ">=3.14.2"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ha_rig"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py314"

lint.select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
]

[tool.ruff.format]
quote-style = "preserve"

[tool.ruff.lint.isort]
order-by-type = true
relative-imports-order = "closest-to-furthest"
extra-standard-library = ["typing"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]
known-first-party = ["ha_rig", "tests"]

[tool.codespell]
ignore-words-list = "hass,currenty"

[dependency-groups]
# The rig imports deviceside's registry and actions, so it needs what deviceside's tests do: keep these in step
# with the dev group of deviceside's pyproject.toml.
dev = [
    "aiohue==4.9.0",
    "pytest-homeassistant-custom-component==0.13.373",
    "pytest-randomly>=5.1.0",
    # Bump with ruff-pre-commit's rev in .pre-commit-config.yaml, so the two never disagree.
    "ruff==0.17.2",
]
