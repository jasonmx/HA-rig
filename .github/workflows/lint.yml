name: Lint

on:
  pull_request:
  push:
    branches:
      - main
      - "wt/**"

permissions: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true

      - name: Install pre-commit
        run: uv pip install --system pre-commit

      - name: Run pre-commit
        run: pre-commit run --all-files

  # The pre-commit hook only sees the working tree; this catches a secret committed and later deleted.
  secrets-history:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Version matches the pre-commit hook. A personal account needs no GITLEAKS_LICENSE.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITLEAKS_VERSION: "8.24.2"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
