name: Tests

on:
  pull_request:
  push:
    branches:
      - main
      - "wt/**"
  # Deviceside moves without a commit here, and can break the rig's tests when it does: catch that daily.
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  pytest:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      # The rig imports deviceside's registry and actions, so it tests against deviceside's newest line of work:
      # whichever of main and the release branches had the latest commit, as deviceside's PRs pick their base.
      - name: Check out deviceside
        run: |
          git clone --quiet --filter=blob:none --no-checkout https://github.com/jasonmx/deviceside ../deviceside
          cd ../deviceside
          git fetch --quiet origin '+refs/heads/main:refs/remotes/origin/main' '+refs/heads/release/*:refs/remotes/origin/release/*'
          ref=$(git for-each-ref --sort=-committerdate --count=1 --format='%(refname:short)' refs/remotes/origin/main 'refs/remotes/origin/release/*')
          echo "deviceside at $ref"
          git checkout --quiet --detach "$ref"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true

      - name: Install test dependencies
        run: uv sync --locked

      - name: Run tests
        run: .venv/bin/pytest -q tests/
