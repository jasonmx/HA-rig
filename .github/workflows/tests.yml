name: Tests

on:
  # edited: a changed Tests-with line reruns the tests against the PR it names.
  pull_request:
    types: [opened, synchronize, reopened, edited]
  # Not wt/** pushes: a push run has no PR body to read Tests-with from, so it would test a paired change apart, and
  # ci-green gates on every run at the head. pr-draft opens a branch's PR on its first push.
  push:
    branches:
      - main
  # Deviceside moves without a commit here, and can break the rig's tests when it does: catch that daily.
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The rig imports deviceside's registry and actions. A PR whose body has `Tests-with: jasonmx/deviceside#N`
      # tests against that deviceside PR; anything else tests against deviceside's newest line of work. The script
      # says which, and why.
      - name: Check out deviceside
        env:
          GH_TOKEN: ${{ github.token }}
          RIG_PR: ${{ github.event.pull_request.number }}
        run: scripts/ci_deviceside.sh ../deviceside "$RIG_PR"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true

      - name: Install test dependencies
        run: uv sync --locked

      - name: Run tests
        run: .venv/bin/pytest -q tests/
